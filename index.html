<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Chootu!</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <audio id="bg-music" src="back.mp3" loop preload="auto"></audio>

    <div id="collage-bg"></div>

    <div id="main-container">
        <h1 id="heading">Happy Birthday Chootu! 🥳</h1>

        <div class="cake-area">
            <img src="1000328906.png" id="cake" alt="Cake">
            <img src="1000328907.png" id="my-melody" alt="My Melody">
        </div>

        <button id="action-btn" onclick="handleStart()">Tap to Play & Cut Cake! 🎂</button>

        <img src="giftbox.png" id="gift-box" onclick="showMessage()" alt="Gift Box">

        <div id="message-popup">
            <div class="popup-content">
                <p>"happy birthday chootu I know will not be there for the cake cutting like you were so I made this hope you like it"</p>
                <button onclick="closeMessage()">Close ❤️</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=10"></script>
</body>
</html>
